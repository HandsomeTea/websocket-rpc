name: Engineering metrics
on:
    workflow_dispatch:
    # push:
    #     branches: [develop]
jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: ["24.15.x"]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
            - uses: pnpm/action-setup@v4
            - run: pnpm install
            - run: pnpm lint
            - run: pnpm test

    coverage:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: ["24.15.x"]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
            - uses: pnpm/action-setup@v4
            - run: pnpm install
            - run: pnpm lint
            - run: pnpm test:coverage

    benchmark:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: ["24.15.x"]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
            - uses: pnpm/action-setup@v4
            - run: pnpm install
            - run: pnpm lint
            - run: pnpm test:benchmark

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "24.15.x"
                  registry-url: "https://registry.npmjs.org"
            - uses: pnpm/action-setup@v4
            - run: pnpm install
            - run: pnpm build
