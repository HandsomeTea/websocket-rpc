name: Code Coverage
on:
    workflow_dispatch:
    # push:
    #     branches: [develop]
jobs:
    coverage:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: ["24.15.x"]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
            - uses: pnpm/action-setup@v4
            - run: pnpm install
            - run: pnpm test:coverage
              id: coverage
            - name: Extract Coverage Output
              id: get_coverage
              run: |
                  COVERAGE=$(node -e "console.log(require('./coverage/coverage-summary.json').total.statements.pct)")
                  echo "pct=${COVERAGE}%" >> $GITHUB_OUTPUT
                  echo "num=${COVERAGE}" >> $GITHUB_OUTPUT

            - name: Update Coverage Badge
              uses: schneegans/dynamic-badges-action@v1.7.0
              with:
                  auth: ${{ secrets.GIST_TOKEN }}
                  gistID: a6c64056620e2edf7f83be8be8cbce9b
                  filename: websocket-rpc-coverage.json
                  label: coverage
                  message: ${{ steps.get_coverage.outputs.pct }}
                  valColorRange: ${{ steps.get_coverage.outputs.num }}
                  minColorRange: 65
                  maxColorRange: 85
                  style: flat-square
