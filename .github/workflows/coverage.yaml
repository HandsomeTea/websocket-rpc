name: Code Coverage
on:
    workflow_dispatch:
    # push:
    #     branches: [develop]
jobs:
    coverage:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: ["24.15.x"]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
            - uses: pnpm/action-setup@v4
            - run: pnpm install
            - run: pnpm test:coverage
